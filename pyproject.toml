[project]
name = "git-agent-mcp"
version = "1.0.0"
description = "Git Agent MCP server for repository monitoring and management"
authors = [
  { name = "Git Agent Team", email = "noreply@example.com" }
]
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
  "fastmcp==2.11.3",
  "pydantic>=2.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/git_agent"]

[project.scripts]
git-agent = "git_agent.server:main"
